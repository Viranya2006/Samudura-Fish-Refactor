name: deploy

# Build the Laravel API + Vite SPA and publish a signed GitHub Release.
# The server has no inbound SSH, so it fetches the newest release itself
# (deploy/pull.sh, cron every 5 minutes, with a read-only token) and installs it.
#
# Deploys never start on their own: Actions → deploy → Run workflow (branch main).
# Requires the tests workflow to have passed for that commit.
# GitHub Environment "production" should allow only main.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production-fish
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      actions: read

    steps:
      - name: Check the tests passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          result="$(gh run list --workflow tests --branch main --event push --commit "$SHA" --json conclusion -q '.[0].conclusion')"
          if [ "$result" != "success" ]; then
            echo "The tests have not passed for $SHA (result: ${result:-not run yet}). Wait for them, then run this again." >&2
            exit 1
          fi

      - name: Checkout the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, intl, gd, zip, bcmath, mbstring
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install production PHP packages
        working-directory: backend
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress

      - name: Build the SPA into backend/public
        run: |
          cp backend/.env.example backend/.env
          cd backend && php artisan key:generate --no-interaction && cd ..
          cd frontend && npm ci && npm run build && cd ..
          rm -f backend/.env

      - name: Package the release
        id: package
        run: |
          name="$(date -u +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)"
          echo "$name" > backend/public/version.txt
          stage="$(mktemp -d)"
          # Release root = Laravel backend (+ deploy scripts for pull/activate).
          rsync -a \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='storage' \
            --exclude='tests' \
            --exclude='node_modules' \
            --exclude='.phpunit.result.cache' \
            --exclude='bootstrap/cache/*.php' \
            backend/ "$stage/"
          mkdir -p "$stage/storage/app" "$stage/storage/framework" "$stage/storage/logs"
          cp -a deploy "$stage/deploy"
          tar -czf "/tmp/$name.tar.gz" -C "$stage" .
          (cd /tmp && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          ls -lh "/tmp/$name.tar.gz"
          rm -rf "$stage"

      - name: Sign the release
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          NAME: ${{ steps.package.outputs.name }}
        run: |
          [ -n "$RELEASE_SIGNING_KEY" ] || { echo "RELEASE_SIGNING_KEY is not set on the production environment" >&2; exit 1; }
          umask 077
          printf '%s\n' "$RELEASE_SIGNING_KEY" > /tmp/signing.pem
          openssl dgst -sha256 -sign /tmp/signing.pem -out "/tmp/$NAME.tar.gz.sig" "/tmp/$NAME.tar.gz"
          rm -f /tmp/signing.pem

      - name: Publish the release for the server
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NAME: ${{ steps.package.outputs.name }}
        run: |
          gh release create "release-$NAME" "/tmp/$NAME.tar.gz" "/tmp/$NAME.tar.gz.sha256" "/tmp/$NAME.tar.gz.sig" \
            --target "$(git rev-parse HEAD)" --title "Release $NAME" --latest \
            --notes "Built from $(git rev-parse --short HEAD). The server installs it within 5 minutes."
          gh release list --limit 100 --json tagName -q '.[].tagName' | grep '^release-' | sort -r | tail -n +11 \
            | xargs -r -I{} gh release delete {} --yes --cleanup-tag

      - name: Wait for the server to install it
        env:
          NAME: ${{ steps.package.outputs.name }}
        run: |
          for i in $(seq 1 40); do
            live="$(curl -fsS --max-time 15 https://samudura-fishmarket.xyz.lk/version.txt 2>/dev/null || true)"
            if [ "$live" = "$NAME" ]; then
              curl --fail --silent --show-error --max-time 20 https://samudura-fishmarket.xyz.lk/up >/dev/null
              echo "Live: $NAME"
              exit 0
            fi
            sleep 15
          done
          echo "The server has not installed $NAME after 10 minutes. Look at shared/deploy.log on the server." >&2
          exit 1
